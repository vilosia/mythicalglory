<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易行 · 上分/下分 标签样式</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=20260714d">
<style>
  body{margin:0;background:#EEF1F6;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;color:#1B2330;}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 16px 70px;}
  h1{font-size:18px;font-weight:700;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;font-size:12.5px;color:#6b7488;margin:0 0 22px;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start;}
  .col{background:#fff;border:1px solid #DCE2EE;border-radius:16px;overflow:hidden;}
  .col h2{font-size:13px;font-weight:700;margin:0;padding:14px 16px 3px;}
  .col .why{font-size:11px;color:#7a8296;line-height:1.55;padding:0 16px 12px;margin:0;}
  .list{border-top:1px solid #F0F1F3;}

  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #F1F2F5;}
  .row:last-child{border-bottom:none;}
  .main{flex:1;min-width:0;}
  .ttl{display:flex;align-items:center;font-size:14px;font-weight:500;color:#1B2330;white-space:nowrap;}
  .tm{font-size:10.5px;color:#9CA3AF;margin-top:4px;}
  .right{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
  .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:#1B2330;}
  .amt.pos{color:#16A34A;}
  .st{font-size:11px;font-weight:500;margin-top:4px;display:inline-flex;align-items:center;gap:5px;line-height:1;}
  .st::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;}
  .st.pd{color:#126BFF;}.st.no{color:#8A93A6;}
  .rej{opacity:.55;}

  /* 标签基础 */
  .tag{display:inline-flex;align-items:center;font-style:normal;font-size:10px;font-weight:600;line-height:1;border-radius:5px;padding:3px 6px;margin-right:8px;flex:none;}
  /* A · 中性灰 */
  .a .tag{background:#EDF1F7;color:#5a6480;}
  /* B · 方向语义（上分=橙/流出，下分=绿/流入）*/
  .b .tag.up{background:#FFF1E8;color:#C2410C;}
  .b .tag.dn{background:#E7F6EC;color:#15873F;}
  /* C · 描边幽灵 */
  .c .tag{background:transparent;border:1px solid #D5DBE6;color:#5a6480;padding:2px 6px;}
  /* D · 方向语义 + 蓝绿（上分=蓝，下分=绿）*/
  .d .tag.up{background:#E7F0FF;color:#0B52CC;}
  .d .tag.dn{background:#E7F6EC;color:#15873F;}
</style>
</head>
<body>
<div class="wrap">
  <h1>交易行 · 「上分 / 下分」标签样式</h1>
  <p class="sub">用标签替代纯文字，与成员名拉开层级。四种备选，都基于当前 D 版布局。</p>

  <div class="grid" id="grid"></div>
</div>

<script>
  var ROWS=[
    {t:'up',name:'王哥',amt:'−20,000.00',pos:false,tm:'今天 09:48',st:'pd',stt:'处理中'},
    {t:'dn',name:'吴先生',amt:'+80,000.00',pos:true,tm:'今天 09:12'},
    {t:'up',name:'杨姐',amt:'−15,000.00',pos:false,tm:'今天 08:35'},
    {t:'dn',name:'孙姐',amt:'+12,000.00',pos:true,tm:'昨天 21:15'},
    {t:'up',name:'周先生',amt:'−8,000.00',pos:false,tm:'07-05 16:30',st:'no',stt:'已拒绝',rej:true}
  ];
  var COLS=[
    {cls:'a',h:'A · 中性灰标签',why:'与状态点/时间同为中性色，最克制；标签只负责“分类”，颜色不抢戏。'},
    {cls:'b',h:'B · 方向语义（橙 / 绿）',why:'上分＝流出（橙），下分＝流入（绿）。颜色即含义，和右侧 +/− 金额呼应。'},
    {cls:'d',h:'D · 方向语义（蓝 / 绿）',why:'同上，但上分用蓝而非橙——更冷静，橙色留给真正的告警。'},
    {cls:'c',h:'C · 描边幽灵标签',why:'只描边不填色，重量最轻；在白底上依然成“块”，但不如填色抢眼。'}
  ];
  function tagLabel(t){return t==='up'?'上分':'下分';}
  function rowHTML(cls,r){
    var tagCls = (cls==='b'||cls==='d') ? 'tag '+(r.t==='up'?'up':'dn') : 'tag';
    var status = r.st ? '<span class="st '+r.st+'">'+r.stt+'</span>' : '';
    return '<div class="row'+(r.rej?' rej':'')+'">'+
      '<div class="main"><div class="ttl"><i class="'+tagCls+'">'+tagLabel(r.t)+'</i>'+r.name+'</div><div class="tm">'+r.tm+'</div></div>'+
      '<div class="right"><div class="amt'+(r.pos?' pos':'')+'">'+r.amt+'</div>'+status+'</div></div>';
  }
  document.getElementById('grid').innerHTML = COLS.map(function(c){
    return '<div class="col '+c.cls+'"><h2>'+c.h+'</h2><p class="why">'+c.why+'</p>'+
      '<div class="list">'+ROWS.map(function(r){return rowHTML(c.cls,r);}).join('')+'</div></div>';
  }).join('');
</script>
</body>
</html>
