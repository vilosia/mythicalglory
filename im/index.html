<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IM168 原型 · 进入策略投注</title>
<!--
  ══ 2026-08-11 · Latest 3 · R1 骨架改版（Alex 会议）═══════════════════════════
  这一档以前是<游戏大厅>本身（现已改名 hall-lottery.html）。Alex 这一轮把落地页换了：

    「我主推我想要玩家一进来第一眼是看到这一个（策略）」
    「去 Iris chat 那边就不用大厅了，你直接拿掉那个大厅，直接放这一个做那个入口」

  为什么留一张转发页、而不是把策略页搬成 index.html：
   · hall-plans.html 是 546KB 的 v15 引擎整版，搬文件名要动它自己 40 多处相对引用
     与 pagenav 的六条旧路由 —— 换来的只是文件名好看，风险不对等。
   · 而 Hector 与客户都是<双击文件夹里的 index.html>开原型的。留这张转发页，
     这个习惯不用改，落地页却已经是策略。

  用 location.replace（不是 href）—— 不留历史记录，否则策略页按返回会弹回这里。
  meta refresh 是 JS 关掉时的兜底；下面那条链接是两者都失效时的最后一手。
  ⚠ 这一页<不要>加样式表或壳：它只活 0.1 秒，加什么都只是让白屏闪一下。
-->
<meta http-equiv="refresh" content="0; url=hall-plans.html">
<script>location.replace('hall-plans.html');</script>
</head>
<body>
  <p style="font:14px/1.6 system-ui,sans-serif;padding:24px;color:#4a5568">
    正在进入 <a href="hall-plans.html">策略投注</a>…
  </p>
</body>
</html>
