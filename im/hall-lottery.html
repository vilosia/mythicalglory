    「我主推我想要玩家一进来第一眼是看到这一个（策略），不要是这一个（手动投注）」

   ① <b>文件改名</b> index.html → hall-lottery.html。新的 index.html 只是一张转发页，
      双击进去直接落 hall-plans.html（策略）—— 双击 index.html 的老习惯不用改。
   ② <b>页名从「游戏大厅」改成「彩票」</b>（Alex：「有彩票，直接叫彩票啦，

   ③ <b>底部导航五项：策略 / 动态 / 彩票 / 开奖 / 明细</b>，「大厅」整项撤掉。
      六个页面的 nav 是同一段结构，用脚本一次换掉的（scratchpad/nav_swap.py）。

   ⚠ 这一版<没做>本页的视觉（Alex 说卡太白、要系列色与整套彩票 logo）——那是 R4，

   · 参考图左下角的 <b>AI 策略</b> 浮标<b>不做</b>：本平台没有这个产品，

      上下相邻，玩家看到的是两个一模一样的名字。
      改法：卡从 flex 行改成<两列网格>（图 56×56 跨两行 ｜ 右列上名字、下倒计时），
      名字 14px、最多两行。14 是量出来的：最长的一行名「极速快乐十分」刚好进 86px。
      ⚠ 顺带修了 reference-theme.css 里三条<竖版卡>时期留下的口径

   ② 每张卡名字下面加<距下期开奖倒计时>，逐秒走，最后 15 秒转红。
      理由：选游戏时真正在比的是「哪一场马上开」，这条原来要点进投注页才看得到。

    /* ⚠ 必须用 img.src（<b>已经解析成绝对地址</b>），不能写相对路径：

  var cycleByName={
    '极速赛车':75,'极速飞艇':75,'极速赛车（自选）':75,'澳洲幸运10':300,

  };
  /* 2026-08-08（Hector）：「距下期」三个字换成一枚<b>时钟图标</b> ——
     卡上其余都是名字与数字，三个中文小字反而像第二个标题；图标只负责说「这是时间」。
     ⚠ 语义交给 title / aria-label（「距下期开奖」），图标本身 aria-hidden。 */
  var clock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/></svg>';
  /* 08-17 全站统一 → 08-17b 收回（Hector：「too many things moving」）：
     一屏十几张卡各转各的进度环＝十几个动画同时跑，眼睛没有落点。
     统一件改回<b>静态时钟</b>（就是上面那支 clock），只有数字在走。

  var ring='<svg class="sealpie tclock" viewBox="0 0 24 24" aria-hidden="true">'+

  /* ══ 08-12I：倒计时 ＋ 按最快开奖排序 ＋ 分类筛选 ＋ 视图切换 ═══════════════════
     这一屏是<b>发车时刻表</b>：14 款游戏里唯一会变的数就是倒计时，所以顺序按它排。
     ⚠ 排序用 <b>style.order</b>，不搬 DOM —— 卡片是带内联 SVG 的大块节点，
       搬来搬去既慢又容易把事件/图片状态搞丢。
     ⚠ <b>绝不跟着秒数重排</b>：那会让卡在手指底下跳，按下去时已经换成别的游戏。
       只在<b>本来就要重画列表的时刻</b>重排 —— 切筛选、切视图、刚进这一屏。
     ⚠ 「即将上线」永远排在最后（它没有盘）。 */
  var cards=[].slice.call(list.querySelectorAll('.gx-card')),timers=[];
  cards.forEach(function(card,i){
    var nm=card.querySelector('.gx-nm'),cyc=nm&&cycleByName[nm.textContent.trim()];
    card._soon=card.classList.contains('soon')||!cyc;
    if(card._soon){card._left=1e9;return;}
    var el=document.createElement('span');
    el.className='gx-timer';
    el.title='距下期开奖';el.setAttribute('aria-label','距下期开奖');
    /* 08-17 全站倒计时统一：时钟轮廓图标 → 与封盘倒计时同一颗<b>进度环</b>（r=8，
       与 .sealpie / .gx-opnext 同规格）。图标只说「这是时间」，环还多说了「剩多少比例」。
       回滚：把 ring 换回上面的 clock 变量（那支 svg 保留未删）。 */
    el.innerHTML=ring+'<b>--:--</b>';
    card.appendChild(el);
    card._left=cyc-(i*11)%cyc;
    card._cyc=cyc;   /* 08-15：时刻表的进度环要按「剩多少 / 一整期多长」画，得记住周期 */
    timers.push({el:el,b:el.querySelector('b'),cyc:cyc,card:card,

  var TCIRC=2*Math.PI*8;   /* 与 .sealpie 同半径 */
  function paintTimers(){
    timers.forEach(function(t){

      var left=t.card._left,ratio=Math.max(0,Math.min(1,left/t.cyc)),
          urgent=window.TIMER_URGENT?window.TIMER_URGENT(left,t.cyc):(left<=15);

      t.el.classList.toggle('hot',urgent);

     ⚠ <b>成员没变就不重建</b>：倒计时是单调递减的，所以名次<b>只在某一款开奖归零时</b>

  var nextHost=document.getElementById('gxNext'),
      nextStrip=document.getElementById('gxNextStrip'),

  var STREAKS=[{pl:'第九名',sd:'大',n:8,blue:false},{pl:'龙虎',sd:'龙',n:6,blue:false},

    nextStrip.innerHTML=pick.map(function(c,i){

      return '<a class="gx-op" href="'+(c.getAttribute('href')||'#')+'">'+

        '<span class="gx-opbeads">'+beads+'</span>'+
        '<span class="gx-opfoot">连开 <b>'+st.n+'</b> 期'+
          /* 08-17b（Hector：too many things moving）：进度环 → 静态时钟，与游戏卡同一支。 */
          '<span class="gx-opnext"><svg class="tclock" viewBox="0 0 24 24" aria-hidden="true">'+
            '<circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/>'+
          '</svg><b>--:--</b></span></span></a>';
    }).join('');
    nextItems=[].slice.call(nextStrip.querySelectorAll('.gx-op'));
    nextItems.forEach(function(el,i){el._src=pick[i];});
    nextHost.hidden=false;
  }
  /* 08-17 全站倒计时统一：环与数字改<b>两态</b>（常态 / .urgent），不再逐秒 hue 插值 ——
     理由与阈值公式见 shared/ui-consistency.js 那段。
     回滚：恢复 `col='hsl('+(120*ratio)+',72%,40%)'` 与 b.style.color / pr.style.stroke 赋值。 */
  var NEXTC=2*Math.PI*8;
  function paintNext(){
    nextItems.forEach(function(el){
      var c=el._src,left=Math.max(0,c._left),cyc=c._cyc||left||1,
          ratio=Math.max(0,Math.min(1,left/cyc)),
          urgent=window.TIMER_URGENT?window.TIMER_URGENT(left,cyc):(left<=15);
      var b=el.querySelector('.gx-opnext>b');
      b.textContent=window.TIMER_TEXT?window.TIMER_TEXT(left):((left/60|0)+':'+(left%60));
      b.style.color='';
      el.querySelector('.gx-opnext').classList.toggle('urgent',urgent);
      /* 08-17b：环退役，这里不再逐秒画弧。ratio 留着，回滚时直接用回来。 */
      void ratio;
    });
  }
  function tick(){paintTimers();buildNext();paintNext();}
  tick();setInterval(tick,1000);

  /* ══ 08-12K：排序只在<b>分区内部</b>做 ═══════════════════════════════════════
     分区回来了，所以「最快开的排最前」是每一区各排各的 —— 跨区排会把分区打散，
     那就等于回到 08-12I 的拉平版。仍然用 style.order，不搬 DOM。 */
  var grps=[].slice.call(list.querySelectorAll('.gx-grp')),
      grids=[].slice.call(list.querySelectorAll('.gx-cards')),
      btns=[].slice.call(tabs.querySelectorAll('button[data-cat]'));
  function applyOrder(){
    grids.forEach(function(g){
      [].slice.call(g.querySelectorAll('.gx-card'))
        .sort(function(x,y){return x._left-y._left;})
        .forEach(function(c,i){c.style.order=i;});
    });
  }

  /* 页签＝<b>jumper</b>：点一下只把对应分区滚到列表顶部，一张卡都不藏。
     款数照旧数 DOM，不手写 —— 加一款游戏不用再改两处。 */
  btns.forEach(function(b){
    var c=b.getAttribute('data-cat');
    var n=cards.filter(function(x){return x.getAttribute('data-cat')===c;}).length;
    b.innerHTML=b.textContent+'<em>'+n+'</em>';
  });
  function markTab(cat){
    btns.forEach(function(x){
      var on=x.getAttribute('data-cat')===cat;
      x.classList.toggle('on',on);x.setAttribute('aria-current',on?'true':'false');
      /* 页签行本身是横向滚动的：当前那枚要自己滑进视野，否则滚到「六合」时
         高亮的那一枚还在右边的渐隐里，看不见。 */
      if(on&&x.scrollIntoView)x.scrollIntoView({block:'nearest',inline:'nearest'});
    });
  }
  /* ⚠ <b>不要用 scrollTo({behavior:'smooth'})</b>：这一档在无头/被遮挡的窗口里
     <b>整个不动</b>（本轮实测：scrollTop 一直是 0，也不报错），演示与截图会看起来像
     页签点了没反应。自己用 rAF 补 260ms 缓动，行为在哪都一样。 */
  var glide;
  function glideTo(to){
    cancelAnimationFrame(glide);
    var from=list.scrollTop,d=to-from,t0=null;
    if(Math.abs(d)<1)return;
    /* ⚠ 页面不可见时 rAF <b>不发帧</b>（后台标签页、截图工具的隐藏窗口）——
       缓动会卡在起点。这种时候直接落位，宁可没有动画也不要「点了不动」。 */
    if(document.hidden){list.scrollTop=to;spy();return;}
    spyLock=1;                /* 滚动过程中别让 spy 把沿途的分区一个个点亮 */
    (function step(ts){
      if(t0===null)t0=ts;
      var k=Math.min(1,(ts-t0)/260),e=1-Math.pow(1-k,3);   /* ease-out cubic */
      list.scrollTop=from+d*e;
      if(k<1)glide=requestAnimationFrame(step);else{spyLock=0;spy();}
    })(performance.now());
  }
  tabs.addEventListener('click',function(e){
    var b=e.target.closest('button[data-cat]');if(!b)return;
    var g=list.querySelector('.gx-grp[data-cat="'+b.getAttribute('data-cat')+'"]');if(!g)return;
    /* ⚠ 点了要<b>钉住</b>这一枚：最后两三区加起来不到一屏，滚到底时它们全在画面里，
       spy 只会认最下面那一区 —— 于是「点 PC28 → 高亮六合」，看起来像点错了。
       钉到玩家自己动手滚下一次为止。 */
    spyPin=b.getAttribute('data-cat');
    markTab(spyPin);
    /* ⚠ 用 scrollTop 自己算，不用 g.scrollIntoView()：后者会连<b>外层 .stage</b>
       一起滚，手机壳会在页面里跳一下。这里只想动 .gx-list 这一个滚动容器。 */
    glideTo(list.scrollTop+(g.getBoundingClientRect().top-list.getBoundingClientRect().top));
  });

  /* 反向：滚列表时页签跟着当前分区走（scroll spy）。
     判定线取列表顶部下方 8px —— 越过这条线的最后一个分区就是「当前」。 */
  var spyLock=0,spyPin=null;
  function spy(){
    if(spyLock||spyPin)return;
    var top=list.getBoundingClientRect().top+8,cur=grps[0];
    grps.forEach(function(g){if(g.getBoundingClientRect().top<=top)cur=g;});
    /* 滚到底时最后一个分区可能永远越不过判定线（它比一屏短），补一条。 */
    if(list.scrollTop+list.clientHeight>=list.scrollHeight-4)cur=grps[grps.length-1];
    if(cur)markTab(cur.getAttribute('data-cat'));
  }
  list.addEventListener('scroll',spy,{passive:true});
  /* 玩家自己动手（滚轮／手指／拖）就解钉，spy 重新接管。 */
  ['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){
    list.addEventListener(ev,function(){spyPin=null;},{passive:true});
  });

  /* 视图切换：双列（默认）⇄ 列表。只切一个 class，卡片 DOM 不动。
     ⚠ 08-12K：要切<b>每个分区</b>的网格，不再是单个 #gxCards。 */
  var vtog=document.getElementById('gxView');
  if(vtog)vtog.addEventListener('click',function(e){
    var b=e.target.closest('button[data-view]');if(!b)return;
    var isList=b.getAttribute('data-view')==='list';
    grids.forEach(function(g){g.classList.toggle('gx-view-list',isList);});
    [].forEach.call(vtog.querySelectorAll('button'),function(x){x.classList.toggle('bd-on',x===b);});
    applyOrder();            /* 切视图＝本来就要重画，顺序顺手刷到最新 */
  });

  applyOrder();spy();
})();
</script>
</body>
</html>
