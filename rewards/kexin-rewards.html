<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FFF8F2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Kexin Rewards" />
<title>Kexin Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   Kexin Rewards — light, airy, mobile-first
   Plenty of white space, hairline borders instead of shadows, one calm accent,
   gold kept only for the points themselves.
   ========================================================================== */

:root {
  --bg: #fcfcfa;
  --card: #ffffff;

  --line: #ebe9e3;
  --line-soft: #f4f2ed;

  --ink: #2c2a26;
  --ink-2: #6d6961;
  --ink-3: #9d988e;

  --accent: #7a9e7e;
  --accent-deep: #5c8161;
  --accent-soft: #f1f5f1;

  --gold: #a8761f;
  --gold-2: #b98a2e;
  --gold-soft: #faf4e8;

  --ok: #6b9a77;
  --wait: #c2913f;
  --no: #bd7f74;

  --r-lg: 22px;
  --r-md: 18px;
  --r-sm: 13px;

  --nav-h: 68px;
  --pad: 22px;

  --font: "Nunito", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
    "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; min-height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
ul, ol, dl, dd { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }

.screen { min-height: 100vh; min-height: 100dvh; }

/* --- icons --------------------------------------------------------------- */

.ic {
  width: 22px;
  height: 22px;
  display: block;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ic-sm { width: 17px; height: 17px; stroke-width: 1.75; }
.ic-lg { width: 26px; height: 26px; stroke-width: 1.45; }
.ic-xl { width: 34px; height: 34px; stroke-width: 1.3; }
.ic-emoji { font-size: 21px; line-height: 1; }

/* ==========================================================================
   LOGIN
   ========================================================================== */

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
}

.login-inner { width: 100%; max-width: 400px; }

.login-badge {
  width: 54px;
  height: 54px;
  margin: 0 0 22px;
  border-radius: 17px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  display: grid;
  place-items: center;
}
.login-badge .ic { width: 26px; height: 26px; }

.login-title {
  margin: 0 0 5px;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.login-sub { margin: 0 0 30px; color: var(--ink-3); font-size: 15px; font-weight: 500; }

.login-card {
  padding: 0;
  background: none;
}

.login-error {
  margin-bottom: 16px;
  padding: 12px 14px;
  border-radius: var(--r-sm);
  background: #fdf3f1;
  color: #a8574a;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.45;
}

.login-foot { margin: 30px 0 0; color: var(--ink-3); font-size: 13.5px; font-weight: 500; }

/* ==========================================================================
   APP SHELL
   ========================================================================== */

.app-screen { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }

.app-content {
  padding: calc(20px + env(safe-area-inset-top)) var(--pad) 32px;
  max-width: 540px;
  margin: 0 auto;
  animation: fade 0.22s ease both;
}

/* --- greeting line ------------------------------------------------------- */

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 34px;
}
.top .who {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--accent-soft);
  color: var(--accent-deep);
  display: grid;
  place-items: center;
}
.top .who img { width: 100%; height: 100%; object-fit: cover; display: block; }
.top .hi { font-size: 16.5px; font-weight: 600; color: var(--ink-2); }

/* --- the balance -------------------------------------------------------- */

.balance { margin-bottom: 40px; }
.balance .cap {
  display: block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.balance .num {
  display: block;
  margin: 4px 0 2px;
  font-size: 68px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: var(--gold);
}
.balance .sub { display: block; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.balance .note {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 18px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-2);
}
.balance .note.wait { color: var(--wait); }
.balance .note.done { color: var(--ok); }

/* --- section heading ---------------------------------------------------- */

.hd {
  margin: 0 0 15px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.hd.sp { margin-top: 38px; }

.page-head { margin-bottom: 26px; }
.page-head h2 {
  margin: 0;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.025em;
}
.page-head p { margin: 6px 0 0; color: var(--ink-3); font-size: 14.5px; font-weight: 500; }

/* --- activity grid ------------------------------------------------------ */

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

.act {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  padding: 17px 16px 15px;
  min-height: 124px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  text-align: left;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.act:active { transform: scale(0.98); border-color: var(--accent); }
.act .ai { color: var(--accent-deep); }
.act .an {
  flex: 1;
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.act .ap { font-size: 14px; font-weight: 700; color: var(--gold-2); }

.act.add {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  gap: 13px;
  min-height: 0;
  padding: 16px;
  background: none;
  border-style: dashed;
  border-color: #ded9cd;
}
.act.add .an { font-size: 15.5px; color: var(--ink-2); }
.act.add .ai { color: var(--ink-3); }
.act.add .ch { color: var(--ink-3); }

/* --- activity / history rows -------------------------------------------- */

.rows { border-top: 1px solid var(--line-soft); }

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 2px;
  border-bottom: 1px solid var(--line-soft);
}
.row .ri { color: var(--accent-deep); }
.row .rm { flex: 1; min-width: 0; }
.row .rn {
  display: block;
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.row .rp { font-size: 15.5px; font-weight: 700; color: var(--gold-2); }

.rs {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
}
.rs .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.rs.ok { color: var(--ok); }
.rs.pending { color: var(--wait); }
.rs.rejected { color: var(--no); }

.day {
  margin: 30px 0 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.day.first { margin-top: 4px; }

.linkish {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 6px 0;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--accent-deep);
  text-align: left;
}

/* --- waiting-for-approval banner ---------------------------------------- */

.pending {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 17px 18px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--line);
  text-align: left;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.pending:active { transform: scale(0.99); border-color: var(--accent); }
.pending .pi { color: var(--wait); }
.pending .pt { flex: 1; min-width: 0; }
.pending .pt strong { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.pending .pt small { display: block; margin-top: 1px; font-size: 13.5px; font-weight: 500; color: var(--ink-3); }
.pending .ch { color: var(--ink-3); }

.pending.calm { background: var(--accent-soft); border-color: transparent; }
.pending.calm .pi { color: var(--ok); }
.pending.calm .pt strong { color: var(--accent-deep); }
.pending.calm .pt small { color: #7c9a82; }

/* --- two small stats ---------------------------------------------------- */

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 26px; }
.stat {
  padding: 15px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.stat b {
  display: block;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.stat span { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.stat.ok b { color: var(--ok); }
.stat.wait b { color: var(--wait); }

/* --- filters (segmented) ------------------------------------------------ */

.filters {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  padding: 4px;
  background: #f4f2ec;
  border-radius: 999px;
}
.filters button {
  flex: 1;
  padding: 9px 6px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  transition: background 0.15s ease, color 0.15s ease;
}
.filters button.on { background: var(--card); color: var(--accent-deep); }

/* --- approval requests -------------------------------------------------- */

.req {
  padding: 19px 18px 17px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 12px;
}
.req .rq-who { font-size: 13px; font-weight: 600; color: var(--ink-3); }
.req .rq-top { display: flex; align-items: center; gap: 13px; margin: 11px 0 14px; }
.req .rq-top .ri { color: var(--accent-deep); }
.req .rq-name {
  font-size: 18.5px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.req .rq-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 17px; }
.req .rq-pts { font-size: 22px; font-weight: 700; color: var(--gold); letter-spacing: -0.03em; }
.req .rq-when { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.tag {
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.rq-acts { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }

/* --- buttons ------------------------------------------------------------ */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 20px;
  border-radius: var(--r-sm);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-align: center;
  transition: transform 0.14s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn.solid { background: var(--accent); color: #fff; }
.btn.solid:active { background: var(--accent-deep); }
.btn.gold { background: var(--gold); color: #fff; }
.btn.line { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.btn.line.warn { color: var(--no); }
.btn.quiet { background: none; color: var(--ink-3); font-weight: 600; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn + .btn { margin-top: 9px; }

.btn-sm {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-2);
}

/* --- forms -------------------------------------------------------------- */

.field { margin-bottom: 17px; }
.field label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 14px 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--card);
  font-weight: 600;
  outline: none;
  transition: border-color 0.15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field .hint { margin-top: 6px; font-size: 13px; color: var(--ink-3); font-weight: 500; }

.picker { display: flex; flex-wrap: wrap; gap: 8px; }
.picker button {
  width: 46px;
  height: 46px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  display: grid;
  place-items: center;
}
.picker button.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-deep);
}

/* --- manage activities -------------------------------------------------- */

.mg {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 15px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 9px;
}
.mg.off { opacity: 0.5; }
.mg .ri { color: var(--accent-deep); }
.mg .mm { flex: 1; min-width: 0; }
.mg .mm strong { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.mg .mm span { font-size: 13px; font-weight: 600; color: var(--gold-2); }

.arrows { display: flex; flex-direction: column; gap: 2px; }
.arrows button {
  width: 28px;
  height: 21px;
  border-radius: 7px;
  color: var(--ink-2);
  display: grid;
  place-items: center;
}
.arrows button .ic { width: 15px; height: 15px; }
.arrows button:disabled { opacity: 0.25; cursor: default; }
.arrows button:active:not(:disabled) { background: var(--accent-soft); color: var(--accent-deep); }

/* --- me / settings ------------------------------------------------------ */

.profile { text-align: center; padding: 6px 0 30px; }
.profile .pface {
  width: 78px;
  height: 78px;
  margin: 0 auto 14px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--accent-soft);
  color: var(--accent-deep);
  display: grid;
  place-items: center;
}
.profile .pface img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.profile p { margin: 3px 0 0; color: var(--ink-3); font-size: 14px; font-weight: 500; }

.menu { margin-bottom: 26px; border-top: 1px solid var(--line-soft); }
.mrow {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 2px;
  border-bottom: 1px solid var(--line-soft);
  text-align: left;
}
.mrow .mi { color: var(--ink-2); }
.mrow .mt { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.mrow .mt small { display: block; margin-top: 1px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.mrow .ch { color: var(--ink-3); }
.mrow:active { background: #faf9f6; }

.facts { margin-bottom: 26px; }
.fact {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14.5px;
}
.fact:first-child { border-top: 1px solid var(--line-soft); }
.fact dt { color: var(--ink-3); font-weight: 500; }
.fact dd { font-weight: 600; text-align: right; }

/* --- links -------------------------------------------------------------- */

.linkbox {
  padding: 16px 17px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 11px;
}
.linkbox .lw { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
.linkbox .lx { margin: 2px 0 11px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.linkbox .lu {
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 11px;
  background: #f7f6f2;
  color: var(--ink-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  word-break: break-all;
}

.note-p {
  margin: 16px 2px 0;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.6;
}

.notice {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 14px 15px;
  margin-bottom: 20px;
  border-radius: var(--r-md);
  background: #fdf8ee;
  color: #8a6a24;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.5;
}
.notice .ic { color: var(--wait); margin-top: 1px; }

/* --- empty states ------------------------------------------------------- */

.empty {
  padding: 54px 20px;
  text-align: center;
  color: var(--ink-3);
}
.empty .ic { margin: 0 auto 14px; width: 30px; height: 30px; stroke-width: 1.3; }
.empty p { margin: 0; font-size: 14.5px; font-weight: 500; }

/* ==========================================================================
   BOTTOM NAV
   ========================================================================== */

.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: flex;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(252, 252, 250, 0.96);
  backdrop-filter: saturate(180%) blur(8px);
  border-top: 1px solid var(--line);
}
.bottom-nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink-3);
}
.bottom-nav button .ic { width: 21px; height: 21px; }
.bottom-nav button.on { color: var(--accent-deep); }
.bottom-nav .dot {
  position: absolute;
  top: 10px;
  margin-left: 19px;
  min-width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--wait);
}

/* ==========================================================================
   SHEETS
   ========================================================================== */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(44, 42, 38, 0.28);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.18s ease both;
}
.sheet {
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  padding: 10px 22px calc(26px + env(safe-area-inset-bottom));
  animation: rise 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.grabber { width: 38px; height: 4px; border-radius: 999px; background: #e3e0d8; margin: 4px auto 20px; }

.sh { text-align: center; padding: 4px 4px 24px; }
.sh .shi {
  width: 62px;
  height: 62px;
  margin: 0 auto 16px;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  display: grid;
  place-items: center;
  animation: pop 0.34s cubic-bezier(0.34, 1.4, 0.64, 1) both;
}
.sh h3 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.sh .shname { margin-top: 5px; font-size: 17px; font-weight: 600; color: var(--ink-2); }
.sh .shpts {
  display: block;
  margin-top: 14px;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.035em;
  color: var(--gold);
}
.sh .shsub { margin: 12px 0 0; color: var(--ink-3); font-size: 14.5px; font-weight: 500; line-height: 1.55; }
.sh.tight { padding-bottom: 14px; }

/* ==========================================================================
   TOAST / BUSY
   ========================================================================== */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 90;
  max-width: 86vw;
  padding: 12px 18px;
  border-radius: 13px;
  background: #33302b;
  color: #fff;
  font-weight: 600;
  font-size: 14.5px;
  text-align: center;
  animation: fade 0.18s ease both;
}
.toast.warn { background: #a8574a; }

.busy {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(252, 252, 250, 0.85);
  display: grid;
  place-items: center;
  font-weight: 600;
  color: var(--ink-3);
}

/* ==========================================================================
   ANIMATION
   ========================================================================== */

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(22px); opacity: 0.5; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (min-width: 460px) {
  .balance .num { font-size: 76px; }
  .act { min-height: 132px; }
}

/* ==========================================================================
   KEXIN'S REWARD WORLD
   A brighter, warmer visual layer. The structure and behaviour stay the same;
   this section only changes how the existing product feels.
   ========================================================================== */

:root {
  --bg: #fff8f2;
  --card: #ffffff;
  --line: #eadff2;
  --line-soft: #f4edf7;
  --ink: #30294f;
  --ink-2: #6e6684;
  --ink-3: #9c94aa;
  --accent: #7657d6;
  --accent-deep: #5a3db8;
  --accent-soft: #eee8ff;
  --gold: #f59a23;
  --gold-2: #df7f08;
  --gold-soft: #fff0c9;
  --ok: #23a77d;
  --wait: #ef9238;
  --no: #df6677;
  --r-lg: 26px;
  --r-md: 22px;
  --r-sm: 16px;
  --nav-h: 84px;
}

body {
  background:
    radial-gradient(circle at -8% 4%, rgba(255, 201, 112, 0.22), transparent 25rem),
    radial-gradient(circle at 108% 18%, rgba(180, 151, 255, 0.2), transparent 27rem),
    var(--bg);
}

/* Login feels like the entrance to her own little reward world. */
.login-screen {
  position: relative;
  overflow: hidden;
  padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
}
.login-screen::before,
.login-screen::after {
  position: absolute;
  z-index: 0;
  color: #ffba46;
  line-height: 1;
  pointer-events: none;
}
.login-screen::before {
  content: "✦";
  top: 9%;
  right: 10%;
  font-size: 38px;
  transform: rotate(12deg);
}
.login-screen::after {
  content: "★";
  bottom: 8%;
  left: 7%;
  font-size: 25px;
  color: #b59cff;
  transform: rotate(-12deg);
}
.login-inner {
  position: relative;
  z-index: 1;
  max-width: 430px;
  padding: 32px 26px 28px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 32px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 24px 70px rgba(82, 58, 125, 0.13);
  backdrop-filter: blur(18px);
}
.login-badge {
  width: 68px;
  height: 68px;
  margin-bottom: 20px;
  border-radius: 23px;
  color: #fff;
  background: linear-gradient(145deg, #8d70ec, #6547ca);
  box-shadow: 0 12px 26px rgba(101, 71, 202, 0.28);
  transform: rotate(-4deg);
}
.login-badge .ic { width: 31px; height: 31px; stroke-width: 1.8; }
.login-title { font-size: 30px; font-weight: 800; color: var(--ink); }
.login-sub { margin-bottom: 26px; color: var(--ink-2); }
.login-foot {
  margin: 24px 0 0;
  color: var(--accent-deep);
  text-align: center;
  font-weight: 700;
}

.field label { color: var(--ink-2); font-weight: 700; }
.field input,
.field select,
.field textarea {
  min-height: 52px;
  border: 2px solid #eee7f1;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 5px 14px rgba(74, 56, 109, 0.04);
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #9a7ceb;
  box-shadow: 0 0 0 4px rgba(118, 87, 214, 0.11);
}

.app-content { padding-top: calc(22px + env(safe-area-inset-top)); }
.top { margin-bottom: 26px; }
.top .who {
  width: 48px;
  height: 48px;
  flex-basis: 48px;
  border: 3px solid #fff;
  box-shadow: 0 5px 16px rgba(67, 48, 101, 0.18), 0 0 0 3px #ffd475;
}
.top .hi { font-size: 17px; font-weight: 800; color: var(--ink); }

/* Kexin's balance becomes the celebratory centrepiece. */
.child-mode .balance {
  position: relative;
  overflow: hidden;
  margin-bottom: 30px;
  padding: 24px 24px 22px;
  border-radius: 30px;
  color: #fff;
  background: linear-gradient(135deg, #694bcb 0%, #8b65e3 58%, #aa7aee 100%);
  box-shadow: 0 18px 38px rgba(91, 61, 184, 0.25);
}
.child-mode .balance::before {
  content: "✦";
  position: absolute;
  top: 16px;
  right: 22px;
  color: #ffe28e;
  font-size: 32px;
  animation: twinkle 2.6s ease-in-out infinite;
}
.child-mode .balance::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  right: -50px;
  bottom: -82px;
  border: 24px solid rgba(255, 255, 255, 0.09);
  border-radius: 50%;
}
.child-mode .balance .cap { color: rgba(255, 255, 255, 0.76); }
.child-mode .balance .num {
  position: relative;
  z-index: 1;
  margin-top: 5px;
  color: #fff;
  font-size: 66px;
  font-weight: 800;
  text-shadow: 0 3px 0 rgba(62, 35, 137, 0.12);
}
.child-mode .balance .sub { color: rgba(255, 255, 255, 0.82); }
.child-mode .balance .note {
  position: relative;
  z-index: 1;
  margin-top: 17px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  backdrop-filter: blur(6px);
}
.child-mode .balance .note.done,
.child-mode .balance .note.wait { color: #fff; }

.hd { font-size: 18px; font-weight: 800; color: var(--ink); }
.page-head h2 { font-weight: 800; color: var(--ink); }

.grid { gap: 13px; }
.act {
  position: relative;
  overflow: hidden;
  min-height: 142px;
  padding: 17px;
  border: 0;
  box-shadow: 0 9px 24px rgba(71, 53, 105, 0.1);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.act:nth-child(1) { background: #eee8ff; }
.act:nth-child(2) { background: #fff0e5; }
.act:nth-child(3) { background: #e5f7ef; }
.act:nth-child(4) { background: #fff4c9; }
.act:active {
  transform: translateY(2px) scale(0.98);
  box-shadow: 0 5px 12px rgba(71, 53, 105, 0.1);
}
.act .ai {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  color: #6547c8;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 5px 12px rgba(71, 53, 105, 0.08);
}
.act:nth-child(2) .ai { color: #db6d58; }
.act:nth-child(3) .ai { color: #218c6a; }
.act:nth-child(4) .ai { color: #c37c05; }
.act .an { font-size: 16px; font-weight: 800; color: var(--ink); }
.act .ap {
  align-self: flex-start;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.75);
  color: var(--accent-deep);
  font-weight: 800;
}
.act.add {
  min-height: 0;
  padding: 16px 17px;
  border: 2px dashed #d9c9ee;
  background: rgba(255, 255, 255, 0.66);
  box-shadow: none;
}
.act.add .ai {
  width: 38px;
  height: 38px;
  color: var(--accent-deep);
  background: var(--accent-soft);
  box-shadow: none;
}
.act.add .an { color: var(--accent-deep); font-weight: 700; }

.rows { display: grid; gap: 10px; border: 0; }
.row {
  padding: 14px 15px;
  border: 1px solid rgba(234, 223, 242, 0.8);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 6px 17px rgba(72, 53, 108, 0.06);
}
.row .ri { color: var(--accent); }
.row .rn { font-weight: 700; }
.row .rp { color: var(--gold-2); font-weight: 800; }

.pending,
.stat,
.req,
.mg,
.linkbox {
  border-color: rgba(225, 211, 237, 0.86);
  box-shadow: 0 8px 22px rgba(72, 53, 108, 0.07);
}
.pending.calm { background: #e8f7f0; }
.filters { background: #eee7f5; }
.filters button.on { box-shadow: 0 3px 9px rgba(74, 55, 108, 0.1); }

.btn { min-height: 52px; border-radius: 17px; font-weight: 800; }
.btn.solid {
  background: linear-gradient(135deg, #8062dd, #6848c8);
  box-shadow: 0 9px 20px rgba(91, 61, 184, 0.22);
}
.btn.solid:active { background: linear-gradient(135deg, #7252cf, #5838b6); }
.btn.line { border: 2px solid #e8def0; }

.bottom-nav {
  left: 12px;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  height: 68px;
  padding: 0;
  border: 1px solid rgba(231, 220, 239, 0.86);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 13px 35px rgba(60, 42, 96, 0.16);
}
.bottom-nav button { color: #aaa2b3; }
.bottom-nav button.on { color: var(--accent-deep); }
.bottom-nav button.on::before {
  content: "";
  position: absolute;
  top: 7px;
  width: 34px;
  height: 27px;
  border-radius: 13px;
  background: var(--accent-soft);
  z-index: -1;
}

.overlay {
  background: rgba(42, 32, 65, 0.42);
  backdrop-filter: blur(5px);
}
.sheet {
  border-radius: 34px 34px 0 0;
  background:
    radial-gradient(circle at 88% 4%, rgba(255, 213, 113, 0.18), transparent 12rem),
    #fffaf6;
  box-shadow: 0 -18px 55px rgba(42, 32, 65, 0.18);
}
.grabber { width: 46px; height: 5px; background: #ded5df; }
.sh { position: relative; }
.sh::before,
.sh::after {
  position: absolute;
  content: "✦";
  color: #ffbb42;
  font-size: 23px;
  animation: twinkle 2.2s ease-in-out infinite;
}
.sh::before { top: 12px; left: 17%; }
.sh::after { top: 54px; right: 17%; color: #a98af0; animation-delay: 0.6s; }
.sh .shi {
  width: 76px;
  height: 76px;
  border-radius: 26px;
  color: #fff;
  background: linear-gradient(145deg, #8f72ec, #6848ca);
  box-shadow: 0 12px 25px rgba(91, 61, 184, 0.25);
}
.sh h3 { font-size: 25px; font-weight: 800; }
.sh .shname { color: var(--ink-2); font-weight: 700; }
.sh .shpts {
  color: var(--gold-2);
  font-size: 42px;
  font-weight: 800;
}

.toast { border-radius: 999px; background: var(--ink); box-shadow: 0 10px 28px rgba(48, 41, 79, 0.25); }

@keyframes twinkle {
  0%, 100% { transform: rotate(-8deg) scale(0.88); opacity: 0.65; }
  50% { transform: rotate(8deg) scale(1.12); opacity: 1; }
}

@media (min-width: 460px) {
  .child-mode .balance .num { font-size: 74px; }
}

</style>
</head>

  if (ICON_PATHS[clean]) return svgIcon(clean, className);

  var toastTimer = null;

  /* ----------------------------------------------------------------- gate */

  var GATE = (function () {
    var raw = (window.location.hash || "").replace(/^#/, "").toLowerCase();
    if (!raw) {
      var match = /[?&]who=([^&]+)/i.exec(window.location.search);
      if (match) raw = decodeURIComponent(match[1]).toLowerCase();
    }
    if (raw === "kexin" || raw === "child" || raw === "kid") return "child";
    if (raw === "parents" || raw === "parent" ||
        raw === "babamama" || raw === "mamababa") return "parents";
    if (raw === "dad" || raw === "papa" || raw === "baba") return "dad";
    if (raw === "mom" || raw === "mum" || raw === "mama") return "mom";
    return "all";
  })();

  function prefillName() {
    if (GATE === "child") return "kexin";
    if (GATE === "dad") return "daddy";
    if (GATE === "mom") return "mommy";
    return "";
  }

  function links() {
    var base = window.location.href.split("#")[0].split("?")[0];
    return { kexin: base + "#kexin", parents: base + "#parents" };
  }

  /* ---------------------------------------------------------------- utils */

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
  function pad(n) { return String(n).padStart(2, "0"); }

  function isoOf(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function todayIso() { return isoOf(new Date()); }

  function nowStamp() {
    var d = new Date();
    return isoOf(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function daysAgoIso(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return isoOf(d);
  }

  function parseDate(str) {
    var bits = String(str || "").slice(0, 10).split("-");
    if (bits.length !== 3) return new Date();
    return new Date(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2]));
  }

  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];

  function longDate(str) {
    var d = parseDate(str);
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  function dayLabel(str) {
    if (str === state.today) return "Today";
    if (str === daysAgoIso(1)) return "Yesterday";
    var d = parseDate(str);
    return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
  }

  function shortWhen(str) {
    if (str === state.today) return "Today";
    if (str === daysAgoIso(1)) return "Yesterday";
    var d = parseDate(str);
    return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3);
  }

  function toInt(value, fallback) {
    if (typeof value === "number" && isFinite(value)) return Math.round(value);
    var clean = String(value == null ? "" : value).replace(/,/g, "").trim();
    if (clean === "") return fallback;
    var n = parseFloat(clean);
    return isNaN(n) ? fallback : Math.round(n);
  }

  // Excel keeps dates as days since 1899-12-30.
  function serialToIso(n) {
    var ms = Math.round((n - 25569) * 86400000);
    var d = new Date(ms);
    return isoOf(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }

  function toDateStr(value) {
    if (value === "" || value === null || value === undefined) return todayIso();
    if (typeof value === "number" && isFinite(value)) {
      return (value > 20000 && value < 90000) ? serialToIso(value) : todayIso();
    }
    var text = String(value).trim();
    var m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(text);
    if (m) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
    m = /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/.exec(text);
    if (m) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
    var parsed = new Date(text);
    return isNaN(parsed.getTime()) ? todayIso() : isoOf(parsed);
  }

  function toStamp(value) {
    if (value === "" || value === null || value === undefined) return "";
    if (typeof value === "number" && isFinite(value)) {
      var whole = Math.floor(value);
      var mins = Math.round((value - whole) * 1440);
      return serialToIso(whole) + " " + pad(Math.floor(mins / 60) % 24) + ":" + pad(mins % 60);
    }
    return String(value).trim();
  }

  function pickStatus(value, allowed, fallback) {
    var text = String(value == null ? "" : value).trim().toLowerCase();
    for (var i = 0; i < allowed.length; i++) {
      if (allowed[i].toLowerCase() === text) return allowed[i];
    }
    return fallback;
  }

  function defaultLogin(name) {
    var key = String(name || "").trim().toLowerCase();
    return LOGINS[key] || [key, key];
  }

  function defaultGreeting(name) {
    var key = String(name || "").trim().toLowerCase();
    return GREETINGS[key] || ("Hi " + String(name || "").trim());
  }

  function toast(message, isWarning) {
    elToast.textContent = message;
    elToast.className = "toast" + (isWarning ? " warn" : "");
    elToast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.hidden = true; }, 3400);
  }

  function busy(on) { elBusy.hidden = !on; }

  /* ----------------------------------------------------------- start data */

  function startingData() {
    var byId = {};
    PRESET_TASKS.forEach(function (t) { byId[t[0]] = t; });

    return {
      users: [
        { userId: "001", name: "Kexin", role: "Applicant", isMainAccount: false,
          status: "Active", loginName: "kexin", password: "kexin",
          greeting: GREETINGS.kexin },
        { userId: "002", name: "Dad", role: "Approver", isMainAccount: true,
          status: "Active", loginName: "daddy", password: "handsome",
          greeting: GREETINGS.dad },
        { userId: "003", name: "Mom", role: "Approver", isMainAccount: false,
          status: "Active", loginName: "mommy", password: "alex",
          greeting: GREETINGS.mom }
      ],
      tasks: PRESET_TASKS.map(function (t) {
        return {
          taskId: t[0], name: t[1], points: t[2], icon: t[3],
          status: "Active", sortOrder: t[4]
        };
      }),
      records: HISTORY.map(function (row, index) {
        var task = byId[row[1]];
        return {
          recordId: "R" + String(index + 1).padStart(3, "0"),
          applicant: "Kexin", date: row[0], taskType: "Preset", taskId: row[1],
          name: task[1], points: task[2], status: "Approved",
          submittedAt: row[0], reviewedBy: "Dad", reviewedAt: row[0], note: ""
        };
      }),
      settings: {
        AppName: "Kexin Rewards",
        CurrencyName: "Points",
        ApplicantName: "Kexin"
      }
    };
  }

  /* --------------------------------------------------------------- storage */

  function saveDB() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      storageWorks = true;
    } catch (e) { storageWorks = false; }
  }

  function loadDB() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch (e) { storageWorks = false; }

    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.users && parsed.tasks && parsed.records) {
          DB = parsed;
          DB.settings = DB.settings || startingData().settings;
          // top up anything an older save is missing
          DB.users.forEach(function (u) {
            if (!u.loginName) u.loginName = defaultLogin(u.name)[0];
            if (!u.password) u.password = defaultLogin(u.name)[1];
            if (!u.greeting) u.greeting = defaultGreeting(u.name);
          });
          return;
        }
      } catch (e) { /* fall through */ }
    }
    DB = startingData();
    saveDB();
  }

  /* ------------------------------------------------------------ selectors */

  function sortedTasks() {
    return DB.tasks.slice().sort(function (a, b) {
      return (toInt(a.sortOrder, 0) - toInt(b.sortOrder, 0)) ||
        String(a.taskId).localeCompare(String(b.taskId));
    });
  }

  function activeTasks() {
    return sortedTasks().filter(function (t) { return t.status === "Active"; });
  }

  function sortedRecords() {
    return DB.records.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      var sa = a.submittedAt || "", sb = b.submittedAt || "";
      if (sa !== sb) return sa < sb ? 1 : -1;
      return a.recordId < b.recordId ? 1 : -1;
    });
  }

  function summary() {
    var available = 0, pending = 0, count = 0;
    DB.records.forEach(function (r) {
      if (r.status === "Approved") available += toInt(r.points, 0);
      else if (r.status === "Pending") { pending += toInt(r.points, 0); count++; }
    });
    return { available: available, pending: pending, pendingCount: count };
  }

  function taskById(id) {
    return DB.tasks.filter(function (t) { return t.taskId === id; })[0] || null;
  }

  function nextId(list, key, prefix) {
    var biggest = 0;
    var re = new RegExp("^" + prefix + "(\\d+)$", "i");
    list.forEach(function (item) {
      var m = re.exec(String(item[key] || "").trim());
      if (m) biggest = Math.max(biggest, parseInt(m[1], 10));
    });
    return prefix + String(biggest + 1).padStart(3, "0");
  }

  function isParent() { return !!state.user && state.user.role !== "Applicant"; }
  function greetingFor(user) { return user.greeting || defaultGreeting(user.name); }

  function avatar(user, className) {
    var photo = AVATARS[user.name];
    var inner = photo ? '<img src="' + photo + '" alt="" />' : svgIcon("person");
    return '<span class="' + className + '">' + inner + "</span>";
  }

  function recordIcon(record, size) {
    if (record.taskType === "Custom") return svgIcon("star", size);
    var task = taskById(record.taskId);
    return iconMarkup(task ? task.icon : "star", size);
  }

  /* ----------------------------------------------------------------- login */

  function loginError(message) {
    var box = $("login-error");
    if (!box) return;
    if (!message) { box.hidden = true; box.textContent = ""; return; }
    box.textContent = message;
    box.hidden = false;
  }

  function showLogin(message) {
    state.user = null;
    document.body.classList.remove("child-mode", "parent-mode");
    closeSheet();
    elApp.hidden = true;
    elLogin.hidden = false;

    var nameBox = $("lg-name");
    var passBox = $("lg-pass");
    if (passBox) passBox.value = "";
    if (nameBox && !nameBox.value) nameBox.value = prefillName();

    var sub = $("login-sub");
    if (sub) {
      sub.textContent = GATE === "child" ? "Hi Kexin, please log in"
        : (GATE === "parents" ? "Dad & Mom, please log in" : "Please log in");
    }

    loginError(message || "");
    window.scrollTo(0, 0);
    if (nameBox && !nameBox.value) nameBox.focus();
    else if (passBox) passBox.focus();
  }

  function enterApp(user) {
    state.user = user;
    document.body.classList.toggle("child-mode", !isParent());
    document.body.classList.toggle("parent-mode", isParent());
    state.view = "home";
    state.filter = "All";
    state.today = todayIso();
    try { sessionStorage.setItem(SESSION_KEY, user.name); } catch (e) { /* fine */ }
    elLogin.hidden = true;
    elApp.hidden = false;
    render();
    window.scrollTo(0, 0);
  }

  $("login-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var name = $("lg-name").value.trim().toLowerCase();
    var pass = $("lg-pass").value.trim();
    if (!name || !pass) { loginError("Please fill in both boxes."); return; }

    var found = DB.users.filter(function (u) {
      return u.status !== "Inactive" &&
        String(u.loginName || "").toLowerCase() === name &&
        String(u.password || "") === pass;
    })[0];

    if (!found) {
      $("lg-pass").value = "";
      loginError("That login name and password do not match. Please try again.");
      return;
    }
    loginError("");
    enterApp(found);
  });

  function logout() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* fine */ }
    var nameBox = $("lg-name");
    if (nameBox) nameBox.value = "";
    showLogin("");
  }

  /* ------------------------------------------------------------------- nav */

  var NAV_CHILD = [["home", "home", "Home"], ["history", "history", "Activity"],
    ["me", "person", "Me"]];
  var NAV_PARENT = [["home", "home", "Home"], ["approve", "approve", "Approve"],
    ["history", "history", "Activity"], ["me", "person", "Me"]];

  function renderNav() {
    var items = isParent() ? NAV_PARENT : NAV_CHILD;
    var count = summary().pendingCount;
    elNav.innerHTML = items.map(function (item) {
      var active = state.view === item[0] ||
        (item[0] === "me" && (state.view === "manage" || state.view === "data"));
      var dot = (item[0] === "approve" && count) ? '<span class="dot"></span>' : "";
      return '<button data-view="' + item[0] + '" class="' + (active ? "on" : "") + '">' +
        dot + svgIcon(item[1]) + "<span>" + item[2] + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(elNav.querySelectorAll("button"), function (btn) {
      btn.addEventListener("click", function () { go(btn.dataset.view); });
    });
  }

  function go(view) {
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  /* ----------------------------------------------------------------- views */

  function render() {
    if (!state.user) { showLogin(); return; }
    state.today = todayIso();
    renderNav();
    var html;
    if (isParent()) {
      if (state.view === "approve") html = viewApprove();
      else if (state.view === "history") html = viewHistory(true);
      else if (state.view === "me") html = viewMe();
      else if (state.view === "manage") html = viewManage();
      else if (state.view === "data") html = viewData();
      else html = viewParentHome();
    } else {
      if (state.view === "history") html = viewHistory(false);
      else if (state.view === "me") html = viewMe();
      else html = viewChildHome();
    }
    elContent.innerHTML = html;
    wire();
  }

  function topBar() {
    return '<div class="top">' + avatar(state.user, "who") +
      '<span class="hi">' + esc(greetingFor(state.user)) + "</span></div>";
  }

  function viewChildHome() {
    var s = summary();
    var note = s.pending > 0
      ? '<span class="note wait">' + svgIcon("clock", "ic-sm") +
        fmt(s.pending) + " points waiting for approval</span>"
      : '<span class="note done">' + svgIcon("check", "ic-sm") +
        "Everything is checked</span>";

    var cards = activeTasks().map(function (t) {
      return '<button class="act" data-task="' + esc(t.taskId) + '">' +
        '<span class="ai">' + iconMarkup(t.icon, "ic-lg") + "</span>" +
        '<span class="an">' + esc(t.name) + "</span>" +
        '<span class="ap">+' + fmt(t.points) + "</span></button>";
    }).join("");

    cards += '<button class="act add" data-custom="1">' +
      '<span class="ai">' + svgIcon("plus") + "</span>" +
      '<span class="an">Add something else</span>' +
      '<span class="ch">' + svgIcon("chevron", "ic-sm") + "</span></button>";

    var recent = sortedRecords().slice(0, 3);
    var lately = recent.length
      ? '<h3 class="hd sp">Lately</h3><ul class="rows">' +
        recent.map(rowHtml).join("") + "</ul>" +
        '<button class="linkish" data-go="history">See everything you have done</button>'
      : "";

    return topBar() +
      '<section class="balance">' +
      '<span class="cap">You have earned</span>' +
      '<span class="num">' + fmt(s.available) + "</span>" +
      '<span class="sub">points</span>' + note + "</section>" +
      '<h3 class="hd">What did you do today?</h3>' +
      '<div class="grid">' + cards + "</div>" + lately;
  }

  function viewParentHome() {
    var s = summary();
    var applicant = DB.settings.ApplicantName || "Kexin";

    var block = s.pendingCount > 0
      ? '<button class="pending" data-go="approve">' +
        '<span class="pi">' + svgIcon("bell") + "</span>" +
        '<span class="pt"><strong>' + s.pendingCount + " waiting for approval</strong>" +
        "<small>" + fmt(s.pending) + " points to check</small></span>" +
        '<span class="ch">' + svgIcon("chevron", "ic-sm") + "</span></button>"
      : '<div class="pending calm">' +
        '<span class="pi">' + svgIcon("checkCircle") + "</span>" +
        '<span class="pt"><strong>All caught up</strong>' +
        "<small>Nothing waiting for approval</small></span></div>";

    var todays = sortedRecords().filter(function (r) { return r.date === state.today; });
    var todayHtml = todays.length
      ? '<h3 class="hd sp">' + esc(applicant) + ' today</h3><ul class="rows">' +
        todays.map(rowHtml).join("") + "</ul>"
      : "";

    return topBar() +
      '<section class="balance">' +
      '<span class="cap">' + esc(applicant) + " has</span>" +
      '<span class="num">' + fmt(s.available) + "</span>" +
      '<span class="sub">points</span></section>' +
      block +
      '<div class="stats">' +
      '<div class="stat ok"><b>' + fmt(s.available) + "</b><span>Approved</span></div>" +
      '<div class="stat wait"><b>' + fmt(s.pending) + "</b><span>Waiting</span></div></div>" +
      todayHtml;
  }

  function viewApprove() {
    var applicant = DB.settings.ApplicantName || "Kexin";
    var pending = sortedRecords().filter(function (r) { return r.status === "Pending"; });

    if (!pending.length) {
      return '<div class="page-head"><h2>Approve</h2><p>Requests from ' +
        esc(applicant) + " arrive here.</p></div>" +
        '<div class="empty">' + svgIcon("checkCircle") +
        "<p>All done. Nothing is waiting for you.</p></div>";
    }

    return '<div class="page-head"><h2>Approve</h2><p>' + pending.length +
      " request" + (pending.length > 1 ? "s" : "") +
      " waiting — one of you is enough.</p></div>" +
      pending.map(function (r) {
        var custom = r.taskType === "Custom";
        return '<article class="req">' +
          '<span class="rq-who">' + esc(applicant) + " completed</span>" +
          '<div class="rq-top"><span class="ri">' + recordIcon(r, "ic-lg") + "</span>" +
          '<span class="rq-name">' + esc(r.name) + "</span></div>" +
          '<div class="rq-meta"><span class="rq-pts">+' + fmt(r.points) + "</span>" +
          '<span class="rq-when">' + esc(shortWhen(r.date)) + "</span>" +
          (custom ? '<span class="tag">Asked for</span>' : "") + "</div>" +
          '<div class="rq-acts">' +
          '<button class="btn line warn" data-review="reject" data-id="' +
          esc(r.recordId) + '">Reject</button>' +
          '<button class="btn solid" data-review="approve" data-id="' +
          esc(r.recordId) + '">Approve</button>' +
          "</div></article>";
      }).join("");
  }

  function rowHtml(r) {
    var label = r.status === "Approved" ? "Approved"
      : (r.status === "Pending" ? "Waiting for approval" : "Not approved");
    var tone = r.status === "Approved" ? "ok"
      : (r.status === "Pending" ? "pending" : "rejected");
    return '<li class="row"><span class="ri">' + recordIcon(r) + "</span>" +
      '<span class="rm"><span class="rn">' + esc(r.name) + "</span>" +
      '<span class="rs ' + tone + '"><i class="dot"></i>' + label + "</span></span>" +
      '<span class="rp">+' + fmt(r.points) + "</span></li>";
  }

  function viewHistory(parentView) {
    var rows = sortedRecords().filter(function (r) {
      return state.filter === "All" || r.status === state.filter;
    });

    var body;
    if (!rows.length) {
      body = '<div class="empty">' + svgIcon("history") + "<p>Nothing here yet.</p></div>";
    } else {
      var html = "";
      var last = null;
      var open = false;
      rows.forEach(function (r) {
        if (r.date !== last) {
          if (open) html += "</ul>";
          html += '<div class="day' + (last === null ? " first" : "") + '">' +
            esc(dayLabel(r.date)) + '</div><ul class="rows">';
          last = r.date;
          open = true;
        }
        html += rowHtml(r);
      });
      if (open) html += "</ul>";
      body = html;
    }

    var head = parentView
      ? '<div class="page-head"><h2>Activity</h2><p>Everything ' +
        esc(DB.settings.ApplicantName || "Kexin") + " has recorded.</p></div>"
      : '<div class="page-head"><h2>My activities</h2>' +
        "<p>Everything you have done. Nice work.</p></div>";

    return head + '<div class="filters">' +
      ["All", "Approved", "Pending"].map(function (f) {
        return '<button data-filter="' + f + '" class="' +
          (state.filter === f ? "on" : "") + '">' + f + "</button>";
      }).join("") + "</div>" + body;
  }

  function viewMe() {
    var u = state.user;
    var s = summary();
    var child = !isParent();

    var stats = child
      ? '<div class="stats" style="margin:0 0 26px">' +
        '<div class="stat ok"><b>' + fmt(s.available) + "</b><span>Available</span></div>" +
        '<div class="stat wait"><b>' + fmt(s.pending) + "</b><span>Waiting</span></div></div>"
      : "";

    var warn = storageWorks ? "" :
      '<div class="notice">' + svgIcon("alert", "ic-sm") +
      "<span>This browser is not letting the app save. Anything you add will be " +
      "lost when you close the tab — please open the file in Chrome or Safari.</span></div>";

    var rows = "";
    if (isParent() && u.isMainAccount) {
      rows += menuRow("sliders", "Manage activities", "", 'data-go="manage"');
    }
    if (isParent()) {
      rows += menuRow("link", "Family links", "Kexin's entrance and yours", 'data-links="1"');
      rows += menuRow("sheet", "Excel backup", "Export, import or start over", 'data-go="data"');
    }

    return '<div class="profile">' + avatar(u, "pface") +
      "<h2>" + esc(u.name) + "</h2><p>" +
      (child ? "Applicant" : (u.isMainAccount ? "Approver · Main account" : "Approver")) +
      "</p></div>" + warn + stats +
      (rows ? '<nav class="menu">' + rows + "</nav>" : "") +
      '<dl class="facts">' +
      fact("Signs in as", u.loginName) +
      fact("Points are called", DB.settings.CurrencyName || "Points") +
      fact("Activities recorded", String(DB.records.length)) +
      "</dl>" +
      '<button class="btn line" data-logout="1">' + svgIcon("logout", "ic-sm") +
      "Log out</button>";
  }

  function menuRow(icon, title, sub, attrs) {
    return '<button class="mrow" ' + attrs + ">" +
      '<span class="mi">' + svgIcon(icon) + "</span>" +
      '<span class="mt">' + esc(title) +
      (sub ? "<small>" + esc(sub) + "</small>" : "") + "</span>" +
      '<span class="ch">' + svgIcon("chevron", "ic-sm") + "</span></button>";
  }

  function fact(label, value) {
    return '<div class="fact"><dt>' + esc(label) + "</dt><dd>" +
      esc(value) + "</dd></div>";
  }

  function viewManage() {
    var actives = activeTasks();
    var offs = sortedTasks().filter(function (t) { return t.status !== "Active"; });

    function line(t, index, total) {
      var arrows = t.status === "Active"
        ? '<span class="arrows">' +
          '<button data-move="up" data-id="' + esc(t.taskId) + '"' +
          (index === 0 ? " disabled" : "") + ">" + svgIcon("up") + "</button>" +
          '<button data-move="down" data-id="' + esc(t.taskId) + '"' +
          (index === total - 1 ? " disabled" : "") + ">" + svgIcon("down") + "</button></span>"
        : "";
      return '<div class="mg' + (t.status === "Active" ? "" : " off") + '">' +
        '<span class="ri">' + iconMarkup(t.icon) + "</span>" +
        '<span class="mm"><strong>' + esc(t.name) + "</strong><span>" +
        fmt(t.points) + " points</span></span>" + arrows +
        '<button class="btn-sm" data-edit="' + esc(t.taskId) + '">Edit</button></div>';
    }

    var offHtml = offs.length
      ? '<h3 class="hd sp">Switched off</h3>' +
        offs.map(function (t) { return line(t, 0, 1); }).join("")
      : "";

    return '<div class="page-head"><h2>Manage activities</h2>' +
      "<p>Names, points and order. Nothing is ever deleted.</p></div>" +
      actives.map(function (t, i) { return line(t, i, actives.length); }).join("") +
      '<button class="btn line" data-newtask="1" style="margin-top:14px">' +
      svgIcon("plus", "ic-sm") + "Add an activity</button>" +
      offHtml +
      '<button class="btn quiet" data-go="me" style="margin-top:14px">Back</button>';
  }

  function viewData() {
    return '<div class="page-head"><h2>Excel backup</h2>' +
      "<p>The points live in this browser. Excel is how you read them, edit " +
      "them and keep them safe.</p></div>" +
      '<nav class="menu">' +
      menuRow("download", "Export to Excel", "Download rewards.xlsx", 'data-export="1"') +
      menuRow("upload", "Import from Excel", "Replace everything with a file", 'data-import="1"') +
      menuRow("refresh", "Start over", "Back to the history up to 20 Aug 2026", 'data-reset="1"') +
      "</nav>" +
      '<p class="note-p">To edit by hand: <b>Export to Excel</b>, open the file, ' +
      "change what you like (points, a wrong status, a date), save it, then " +
      "<b>Import from Excel</b>. Keep the four sheets and their header rows as they are.</p>" +
      '<p class="note-p">Export now and then as a backup — clearing your browser ' +
      "data would otherwise erase the points.</p>" +
      '<button class="btn quiet" data-go="me" style="margin-top:14px">Back</button>';
  }

  /* --------------------------------------------------------------- wiring */

  function each(selector, fn) {
    Array.prototype.forEach.call(elContent.querySelectorAll(selector), fn);
  }

  function wire() {
    each("[data-task]", function (el) {
      el.addEventListener("click", function () { sheetPreset(el.dataset.task); });
    });
    each("[data-custom]", function (el) {
      el.addEventListener("click", function () { sheetCustom(); });
    });
    each("[data-go]", function (el) {
      el.addEventListener("click", function () { go(el.dataset.go); });
    });
    each("[data-filter]", function (el) {
      el.addEventListener("click", function () {
        state.filter = el.dataset.filter;
        render();
      });
    });
    each("[data-review]", function (el) {
      el.addEventListener("click", function () { review(el.dataset.id, el.dataset.review); });
    });
    each("[data-logout]", function (el) { el.addEventListener("click", logout); });
    each("[data-links]", function (el) { el.addEventListener("click", sheetLinks); });
    each("[data-edit]", function (el) {
      el.addEventListener("click", function () { sheetEditTask(el.dataset.edit); });
    });
    each("[data-newtask]", function (el) {
      el.addEventListener("click", function () { sheetEditTask(null); });
    });
    each("[data-move]", function (el) {
      el.addEventListener("click", function () { moveTask(el.dataset.id, el.dataset.move); });
    });
    each("[data-export]", function (el) { el.addEventListener("click", exportExcel); });
    each("[data-import]", function (el) {
      el.addEventListener("click", function () { elFile.value = ""; elFile.click(); });
    });
    each("[data-reset]", function (el) { el.addEventListener("click", sheetReset); });
  }

  /* -------------------------------------------------------------- sheets */

  function openSheet(html) {
    elSheet.innerHTML = '<div class="grabber"></div>' + html;
    elOverlay.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    elOverlay.hidden = true;
    elSheet.innerHTML = "";
    document.body.style.overflow = "";
  }

  elOverlay.addEventListener("click", function (event) {
    if (event.target === elOverlay) closeSheet();
  });

  function sheetPreset(taskId) {
    var task = taskById(taskId);
    if (!task || task.status !== "Active") return;

    openSheet('<div class="sh">' +
      '<div class="shi">' + iconMarkup(task.icon, "ic-xl") + "</div>" +
      "<h3>Nicely done</h3>" +
      '<div class="shname">' + esc(task.name) + "</div>" +
      '<span class="shpts">+' + fmt(task.points) + "</span></div>" +
      '<div class="field"><label for="s-date">When did you do it?</label>' +
      '<input type="date" id="s-date" value="' + esc(state.today) +
      '" max="' + esc(state.today) + '" />' +
      '<div class="hint">Today is ' + esc(longDate(state.today)) + "</div></div>" +
      '<button class="btn solid" id="s-send">Send for approval</button>' +
      '<button class="btn quiet" id="s-cancel">Not now</button>');

    $("s-cancel").addEventListener("click", closeSheet);
    $("s-send").addEventListener("click", function () {
      this.disabled = true;
      sheetDone(addRecord({
        taskType: "Preset", taskId: task.taskId, name: task.name,
        points: task.points, date: $("s-date").value || state.today
      }));
    });
  }

  function sheetCustom(prefill) {
    var pre = prefill || { name: "", points: "", date: state.today };
    openSheet('<div class="sh tight">' +
      '<div class="shi">' + svgIcon("star", "ic-xl") + "</div>" +
      "<h3>What did you do?</h3>" +
      '<p class="shsub">Tell Dad &amp; Mom about something special.</p></div>' +
      '<div class="field"><label for="c-name">What did you do?</label>' +
      '<input type="text" id="c-name" maxlength="120" placeholder="Got 100 marks on my test" value="' +
      esc(pre.name) + '" /></div>' +
      '<div class="field"><label for="c-points">How many points are you asking for?</label>' +
      '<input type="number" id="c-points" min="1" max="100000" inputmode="numeric" placeholder="1000" value="' +
      esc(pre.points) + '" /></div>' +
      '<div class="field"><label for="c-date">When was it?</label>' +
      '<input type="date" id="c-date" value="' + esc(pre.date || state.today) +
      '" max="' + esc(state.today) + '" /></div>' +
      '<button class="btn solid" id="c-next">Check my request</button>' +
      '<button class="btn quiet" id="c-cancel">Cancel</button>');

    $("c-cancel").addEventListener("click", closeSheet);
    $("c-next").addEventListener("click", function () {
      var name = $("c-name").value.trim();
      var points = parseInt($("c-points").value, 10);
      if (!name) { toast("Please tell us what you did.", true); return; }
      if (!points || points < 1) { toast("Please enter how many points.", true); return; }
      sheetCustomConfirm({
        name: name, points: points, date: $("c-date").value || state.today
      });
    });
  }

  function sheetCustomConfirm(req) {
    openSheet('<div class="sh">' +
      '<div class="shi">' + svgIcon("star", "ic-xl") + "</div>" +
      "<h3>Your request</h3>" +
      '<div class="shname">' + esc(req.name) + "</div>" +
      '<span class="shpts">+' + fmt(req.points) + "</span>" +
      '<p class="shsub">' + esc(longDate(req.date)) + "</p></div>" +
      '<button class="btn solid" id="cc-send">Send for approval</button>' +
      '<button class="btn quiet" id="cc-back">Change something</button>');

    $("cc-back").addEventListener("click", function () { sheetCustom(req); });
    $("cc-send").addEventListener("click", function () {
      this.disabled = true;
      sheetDone(addRecord({
        taskType: "Custom", taskId: "", name: req.name,
        points: req.points, date: req.date
      }));
    });
  }

  function sheetDone(record) {
    openSheet('<div class="sh">' +
      '<div class="shi">' + svgIcon("sparkle", "ic-xl") + "</div>" +
      "<h3>Sent</h3>" +
      '<span class="shpts">+' + fmt(record.points) + "</span>" +
      '<p class="shsub">Dad &amp; Mom will take a look.<br />' +
      "These points are waiting for approval.</p></div>" +
      '<button class="btn solid" id="d-ok">Done</button>');
    $("d-ok").addEventListener("click", function () { closeSheet(); render(); });
  }

  function sheetReset() {
    openSheet('<div class="sh">' +
      '<div class="shi">' + svgIcon("refresh", "ic-xl") + "</div>" +
      "<h3>Start over?</h3>" +
      '<p class="shsub">This clears every record and puts back the four ' +
      "activities and the history up to 20 Aug 2026. Export to Excel first " +
      "if you want to keep what is here.</p></div>" +
      '<button class="btn line warn" id="r-yes">Yes, start over</button>' +
      '<button class="btn quiet" id="r-no">Keep my data</button>');
    $("r-no").addEventListener("click", closeSheet);
    $("r-yes").addEventListener("click", function () {
      DB = startingData();
      saveDB();
      closeSheet();
      state.view = "home";
      render();
      toast("Back to a fresh start");
    });
  }

  function sheetLinks() {
    var l = links();
    openSheet('<div class="sh tight">' +
      '<div class="shi">' + svgIcon("link", "ic-xl") + "</div>" +
      "<h3>Family links</h3>" +
      '<p class="shsub">Same file, different door — each one opens the login ' +
      "page with that name filled in.</p></div>" +
      linkBox("Kexin", "Her own screens — no approving.", l.kexin, "lk-a") +
      linkBox("Dad &amp; Mom", "Approving and settings.", l.parents, "lk-b") +
      '<button class="btn quiet" id="lk-close" style="margin-top:14px">Done</button>');

    $("lk-close").addEventListener("click", closeSheet);
    wireCopy("lk-a", l.kexin);
    wireCopy("lk-b", l.parents);
  }

  function linkBox(who, what, url, id) {
    return '<div class="linkbox"><div class="lw">' + who + "</div>" +
      '<div class="lx">' + what + "</div>" +
      '<div class="lu">' + esc(url) + "</div>" +
      '<button class="btn-sm" id="' + id + '">Copy link</button></div>';
  }

  function wireCopy(id, text) {
    var btn = $(id);
    if (!btn) return;
    btn.addEventListener("click", function () {
      var done = function () {
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = "Copy link"; }, 1800);
      };
      var fallback = function () {
        var box = document.createElement("textarea");
        box.value = text;
        box.setAttribute("readonly", "");
        box.style.position = "fixed";
        box.style.opacity = "0";
        document.body.appendChild(box);
        box.select();
        try { document.execCommand("copy"); done(); }
        catch (e) { toast("Please copy the link by hand.", true); }
        document.body.removeChild(box);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else { fallback(); }
    });
  }

  function sheetEditTask(taskId) {
    var task = taskId ? taskById(taskId)
      : { taskId: "", name: "", points: "", icon: "star", status: "Active" };
    if (!task) return;

    var picker = ICON_CHOICES.map(function (key) {
      return '<button type="button" data-icon="' + key + '" class="' +
        (key === task.icon ? "on" : "") + '">' + svgIcon(key) + "</button>";
    }).join("");

    var toggle = taskId
      ? '<button class="btn line" id="t-toggle">' +
        (task.status === "Active" ? "Switch this activity off" : "Switch it back on") +
        "</button>"
      : "";

    openSheet('<div class="sh tight">' +
      '<div class="shi">' + iconMarkup(task.icon, "ic-xl") + "</div>" +
      "<h3>" + (taskId ? "Edit activity" : "New activity") + "</h3></div>" +
      '<div class="field"><label for="t-name">Name</label>' +
      '<input type="text" id="t-name" maxlength="60" value="' + esc(task.name) +
      '" placeholder="Piano Practice" /></div>' +
      '<div class="field"><label for="t-points">Points</label>' +
      '<input type="number" id="t-points" min="1" inputmode="numeric" value="' +
      esc(task.points) + '" placeholder="100" /></div>' +
      '<div class="field"><label>Icon</label>' +
      '<div class="picker" id="t-icons">' + picker + "</div></div>" +
      '<button class="btn solid" id="t-save">Save</button>' + toggle +
      '<button class="btn quiet" id="t-cancel">Cancel</button>');

    var chosen = task.icon || "star";
    Array.prototype.forEach.call(elSheet.querySelectorAll("#t-icons button"), function (btn) {
      btn.addEventListener("click", function () {
        chosen = btn.dataset.icon;
        Array.prototype.forEach.call(elSheet.querySelectorAll("#t-icons button"),
          function (b) { b.classList.remove("on"); });
        btn.classList.add("on");
      });
    });

    $("t-cancel").addEventListener("click", closeSheet);

    $("t-save").addEventListener("click", function () {
      var name = $("t-name").value.trim();
      var points = parseInt($("t-points").value, 10);
      if (!name) { toast("Please enter a name.", true); return; }
      if (!points || points < 1) { toast("Points must be more than zero.", true); return; }

      if (taskId) {
        var existing = taskById(taskId);
        existing.name = name;
        existing.points = points;
        existing.icon = chosen;
      } else {
        var order = DB.tasks.reduce(function (max, t) {
          return Math.max(max, toInt(t.sortOrder, 0));
        }, 0) + 1;
        DB.tasks.push({
          taskId: nextId(DB.tasks, "taskId", "T"), name: name, points: points,
          icon: chosen, status: "Active", sortOrder: order
        });
      }
      saveDB();
      closeSheet();
      render();
      toast("Saved");
    });

    if (taskId) {
      $("t-toggle").addEventListener("click", function () {
        var existing = taskById(taskId);
        existing.status = existing.status === "Active" ? "Inactive" : "Active";
        saveDB();
        closeSheet();
        render();
        toast(existing.status === "Active" ? "Switched back on" : "Switched off");
      });
    }
  }

  /* ------------------------------------------------------------ mutations */

  function addRecord(input) {
    var record = {
      recordId: nextId(DB.records, "recordId", "R"),
      applicant: state.user ? state.user.name : (DB.settings.ApplicantName || "Kexin"),
      date: toDateStr(input.date),
      taskType: input.taskType,
      taskId: input.taskId || "",
      name: input.name,
      points: toInt(input.points, 0),
      status: "Pending",
      submittedAt: nowStamp(),
      reviewedBy: "",
      reviewedAt: "",
      note: ""
    };
    DB.records.push(record);
    saveDB();
    return record;
  }

  function review(recordId, decision) {
    if (!isParent()) { toast("Only Dad or Mom can approve.", true); return; }
    var record = DB.records.filter(function (r) { return r.recordId === recordId; })[0];
    if (!record) { toast("That request is gone.", true); render(); return; }
    if (record.status !== "Pending") {
      toast("Already " + record.status.toLowerCase() + " by " + (record.reviewedBy || "someone"));
      render();
      return;
    }
    record.status = decision === "approve" ? "Approved" : "Rejected";
    record.reviewedBy = state.user.name;
    record.reviewedAt = nowStamp();
    saveDB();
    render();
    toast(decision === "approve" ? "Approved — points added" : "Rejected");
  }

  function moveTask(taskId, direction) {
    var ids = activeTasks().map(function (t) { return t.taskId; });
    var i = ids.indexOf(taskId);
    var j = direction === "up" ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids[i] = ids[j];
    ids[j] = taskId;
    ids.forEach(function (id, index) {
      var t = taskById(id);
      if (t) t.sortOrder = index + 1;
    });
    saveDB();
    render();
  }

  /* --------------------------------------------------------- excel bridge */

  function toSheets() {
    return [
      {
        name: "Users", headers: HEADERS.Users, widths: WIDTHS.Users,
        rows: DB.users.map(function (u) {
          var fb = defaultLogin(u.name);
          return [u.userId, u.name, u.role, u.isMainAccount ? "Yes" : "No",
            u.status || "Active", u.loginName || fb[0], u.password || fb[1],
            u.greeting || defaultGreeting(u.name)];
        })
      },
      {
        name: "Tasks", headers: HEADERS.Tasks, widths: WIDTHS.Tasks,
        rows: sortedTasks().map(function (t) {
          return [t.taskId, t.name, toInt(t.points, 0), t.icon, t.status,
            toInt(t.sortOrder, 0)];
        })
      },
      {
        name: "Records", headers: HEADERS.Records, widths: WIDTHS.Records,
        rows: DB.records.map(function (r) {
          return [r.recordId, r.applicant, r.date, r.taskType, r.taskId, r.name,
            toInt(r.points, 0), r.status, r.submittedAt, r.reviewedBy,
            r.reviewedAt, r.note];
        })
      },
      {
        name: "Settings", headers: HEADERS.Settings, widths: WIDTHS.Settings,
        rows: Object.keys(DB.settings).map(function (k) { return [k, DB.settings[k]]; })
      }
    ];
  }

  function exportExcel() {
    busy(true);
    setTimeout(function () {
      try {
        var blob = XLS.build(toSheets());
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "rewards.xlsx";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast("rewards.xlsx downloaded");
      } catch (err) {
        toast(err.message || "Could not build the Excel file.", true);
      }
      busy(false);
    }, 30);
  }

  function rowsToObjects(rows) {
    if (!rows || !rows.length) return [];
    var headers = (rows[0] || []).map(function (h) {
      return String(h == null ? "" : h).trim();
    });
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i] || [];
      var blank = true;
      for (var c = 0; c < row.length; c++) {
        if (row[c] !== "" && row[c] !== null && row[c] !== undefined) { blank = false; break; }
      }
      if (blank) continue;
      var item = {};
      headers.forEach(function (h, index) {
        if (h) item[h] = row[index] === undefined ? "" : row[index];
      });
      out.push(item);
    }
    return out;
  }

  function importSheets(sheets) {
    var fallback = startingData();

    var users = rowsToObjects(sheets.Users).map(function (r) {
      var fb = defaultLogin(r.Name);
      return {
        userId: String(r.UserID == null ? "" : r.UserID).trim(),
        name: String(r.Name == null ? "" : r.Name).trim(),
        role: String(r.Role || "Approver").trim(),
        isMainAccount: /^(yes|y|true|1)$/i.test(String(r.IsMainAccount || "").trim()),
        status: pickStatus(r.Status, ["Active", "Inactive"], "Active"),
        loginName: String(r.LoginName == null ? "" : r.LoginName).trim() || fb[0],
        password: String(r.Password == null ? "" : r.Password).trim() || fb[1],
        greeting: String(r.Greeting == null ? "" : r.Greeting).trim() ||
          defaultGreeting(r.Name)
      };
    }).filter(function (u) { return u.name; });
    if (!users.length) users = fallback.users;
    if (!users.some(function (u) { return u.role === "Applicant"; })) {
      throw new Error("The Users sheet needs at least one row with Role = Applicant.");
    }

    var tasks = rowsToObjects(sheets.Tasks).map(function (r, i) {
      return {
        taskId: String(r.TaskID == null ? "" : r.TaskID).trim() ||
          ("T" + String(i + 1).padStart(3, "0")),
        name: String(r.TaskName == null ? "" : r.TaskName).trim(),
        points: toInt(r.Points, 0),
        icon: String(r.Icon || "star").trim() || "star",
        status: pickStatus(r.Status, ["Active", "Inactive"], "Active"),
        sortOrder: toInt(r.SortOrder, i + 1)
      };
    }).filter(function (t) { return t.name; });
    if (!tasks.length) tasks = fallback.tasks;

    var records = rowsToObjects(sheets.Records).map(function (r, i) {
      var taskId = String(r.TaskID == null ? "" : r.TaskID).trim();
      return {
        recordId: String(r.RecordID == null ? "" : r.RecordID).trim() ||
          ("R" + String(i + 1).padStart(3, "0")),
        applicant: String(r.Applicant || "Kexin").trim(),
        date: toDateStr(r.Date),
        taskType: pickStatus(r.TaskType, ["Preset", "Custom"], taskId ? "Preset" : "Custom"),
        taskId: taskId,
        name: String(r.TaskName == null ? "" : r.TaskName).trim(),
        points: toInt(r.Points, 0),
        status: pickStatus(r.Status, ["Pending", "Approved", "Rejected"], "Pending"),
        submittedAt: toStamp(r.SubmittedAt),
        reviewedBy: String(r.ReviewedBy == null ? "" : r.ReviewedBy).trim(),
        reviewedAt: toStamp(r.ReviewedAt),
        note: String(r.Note == null ? "" : r.Note).trim()
      };
    }).filter(function (r) { return r.name; });

    var settings = {};
    rowsToObjects(sheets.Settings).forEach(function (r) {
      var key = String(r.Setting == null ? "" : r.Setting).trim();
      if (key) settings[key] = r.Value == null ? "" : r.Value;
    });
    ["AppName", "CurrencyName", "ApplicantName"].forEach(function (k) {
      if (!settings[k]) settings[k] = fallback.settings[k];
    });

    return { users: users, tasks: tasks, records: records, settings: settings };
  }

  elFile.addEventListener("change", function () {
    var file = elFile.files && elFile.files[0];
    if (!file) return;
    busy(true);
    file.arrayBuffer()
      .then(function (buf) { return XLS.read(buf); })
      .then(function (sheets) {
        if (!sheets.Records && !sheets.Tasks && !sheets.Users) {
          throw new Error("That workbook has no Users / Tasks / Records sheets.");
        }
        DB = importSheets(sheets);
        saveDB();
        busy(false);

        var still = DB.users.filter(function (u) {
          return state.user && u.name === state.user.name;
        })[0];
        if (still) {
          state.user = still;
          state.view = "home";
          render();
        } else {
          logout();
        }
        toast("Imported " + DB.records.length + " records from Excel");
      })
      .catch(function (err) {
        busy(false);
        toast(err.message || "Could not read that file.", true);
      });
  });

  /* ------------------------------------------------------------ start up */

  loadDB();
  state.today = todayIso();

  try {
    localStorage.setItem("kexinRewards.test", "1");
    localStorage.removeItem("kexinRewards.test");
  } catch (e) { storageWorks = false; }

  (function () {
    var saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) { /* fine */ }
    var user = saved && DB.users.filter(function (u) { return u.name === saved; })[0];
    if (user) enterApp(user);
    else showLogin();
  })();

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.user &&
        state.today !== todayIso()) {
      render();
    }
  });
})();
</script>
